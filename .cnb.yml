# CNB cloud-native build pipeline for the Tokeness China mainland image.
# Same source as GitHub l1i1/new-api (tokeness/main). This pipeline bakes the
# mainland flavour (VITE_SITE_FLAVOR=mainland) + compliance filing numbers into
# the frontend, then pushes the image to this repo's CNB Docker registry.
#
# A branch push only builds images. Pushing a release tag builds the immutable
# image and then chains into the gated api_trigger deploy pipeline (unattended).
# The cn-production tag-deploy event below remains as the manual approval path.
#
# The pushed image is addressable as:
#   docker.cnb.cool/imvhb/new-api-cn:ml-<full-commit-sha>
#   docker.cnb.cool/imvhb/new-api-cn:ml-latest

tokeness/main:
  push:
    - services:
        - docker
      # deploy.sh (tests + production release) needs python3, which the CNB
      # default build env does not ship; see deployment/tokeness-cn/ci/Dockerfile.cnb.
      docker:
        build: deployment/tokeness-cn/ci/Dockerfile.cnb
      env:
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        CNB_SITE_FLAVOR: mainland
      stages:
        - name: validate mainland deployment tooling
          script: |
            python3 --version
            bash -n deployment/tokeness-cn/deploy.sh
            for helper in deployment/tokeness-cn/tests/fake-bin/*; do
              bash -n "$helper"
            done
            bash -n deployment/tokeness-cn/tests/deploy-test.sh
            bash deployment/tokeness-cn/tests/deploy-test.sh
            jq -e . deployment/tokeness-cn/nodes.json >/dev/null
        - name: build mainland image
          script: |
            IMAGE_TAG="ml-${CNB_COMMIT}"
            # Fail closed: only a confirmed missing manifest may proceed.
            # Reuses the tokeness-publish.yml guard (inspect exit 0 = exists;
            # manifest unknown/not found = free; anything else = block).
            set +e
            CHECK_OUTPUT=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" 2>&1)
            CHECK_STATUS=$?
            set -e
            if [ "$CHECK_STATUS" -eq 0 ]; then
              echo "ERROR: immutable image tag already exists: $IMAGE_NAME:$IMAGE_TAG" >&2
              exit 1
            fi
            if ! printf '%s' "$CHECK_OUTPUT" | grep -Eiq 'manifest unknown|not found'; then
              echo "ERROR: could not confirm $IMAGE_NAME:$IMAGE_TAG is free (exit $CHECK_STATUS)" >&2
              printf '%s\n' "$CHECK_OUTPUT" >&2
              exit "$CHECK_STATUS"
            fi
            # Bake the build version into the upstream's (intentionally empty)
            # VERSION file: Dockerfile.tokeness feeds it to the Go binary via
            # ldflags and to the frontend via VITE_REACT_APP_VERSION. Same
            # format as the overseas tokeness-publish releases, but derived
            # from the commit because CNB push builds have no manual input.
            printf 'v1.0.0-tokeness-mainland.%s\n' "${CNB_COMMIT:0:8}" > VERSION
            cat VERSION
            # 备案号直接内联为 build-arg 值，避免 CNB env -> docker 中转时中文丢失。
            docker build \
              --build-arg "VITE_SITE_FLAVOR=$CNB_SITE_FLAVOR" \
              --build-arg "VITE_ICP_BEIAN=蜀ICP备2026014369号-5" \
              --build-arg "VITE_POLICE_BEIAN=川公网安备51052202010119号" \
              -t "$IMAGE_NAME:$IMAGE_TAG" \
              -t "$IMAGE_NAME:ml-latest" \
              -f Dockerfile.tokeness \
              .
        - name: push mainland image
          script: |
            IMAGE_TAG="ml-${CNB_COMMIT}"
            docker push "$IMAGE_NAME:$IMAGE_TAG"
            docker push "$IMAGE_NAME:ml-latest"

# "Tag is version" release line. Pushing a v<semver>-tokeness-mainland.<N> tag
# builds an immutable ml-<tag> image whose VERSION equals the tag name. The
# separately approved cn-production tag-deploy event (deploy button, owner/
# master only) then certifies the digest and rolls the release out to
# production with deployment/tokeness-cn/deploy.sh deploy-release. The Alibaba
# Cloud RAM credentials and the SWAS SSH key/known-hosts arrive as encrypted
# CNB repo env vars (see deployment/tokeness-cn/README.md for the list); the
# stage fails closed when any of them is missing.
$:
  tag_push:
    - services:
        - docker
      env:
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: validate release tag and bake version
          script: |
            TAG="$CNB_BRANCH"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+-tokeness-mainland\.[0-9]+$'; then
              echo "ERROR: mainland release tag must be v<semver>-tokeness-mainland.<N> (got '$TAG')" >&2
              exit 1
            fi
            printf '%s\n' "$TAG" > VERSION
            echo "Release $TAG (commit ${CNB_COMMIT})"
        - name: build immutable release image
          script: |
            IMAGE_TAG="ml-${CNB_BRANCH}"
            set +e
            CHECK_OUTPUT=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" 2>&1)
            CHECK_STATUS=$?
            set -e
            if [ "$CHECK_STATUS" -eq 0 ]; then
              echo "ERROR: immutable image tag already exists: $IMAGE_NAME:$IMAGE_TAG" >&2
              exit 1
            fi
            if ! printf '%s' "$CHECK_OUTPUT" | grep -Eiq 'manifest unknown|not found'; then
              echo "ERROR: could not confirm $IMAGE_NAME:$IMAGE_TAG is free (exit $CHECK_STATUS)" >&2
              exit "$CHECK_STATUS"
            fi
            docker build \
              --build-arg "VITE_SITE_FLAVOR=mainland" \
              --build-arg "VITE_ICP_BEIAN=蜀ICP备2026014369号-5" \
              --build-arg "VITE_POLICE_BEIAN=川公网安备51052202010119号" \
              -t "$IMAGE_NAME:$IMAGE_TAG" \
              -f Dockerfile.tokeness \
              .
        - name: push immutable release image
          script: |
            IMAGE_TAG="ml-${CNB_BRANCH}"
            docker push "$IMAGE_NAME:$IMAGE_TAG"
            echo "Published $IMAGE_NAME:$IMAGE_TAG (version ${CNB_BRANCH})"
        # Unattended release: chain into the gated deploy pipeline. sync=true
        # makes a failed release fail this build instead of leaving a green tag.
        - name: deploy to production
          type: cnb:apply
          options:
            event: api_trigger
            sync: true
            title: CN production deploy ${CNB_BRANCH}

  # Unattended China production release (api_trigger). Chained from the tag_push
  # pipeline above; can also be triggered directly through the CNB API. Uses the
  # same gated master-first deploy.sh path as the manual tag_deploy.cn-production
  # button below, so either entry point is equivalent.
  #
  # Event name is exactly `api_trigger` because the key repo authorizes
  # allow_events with that literal glob (it does not match `api_trigger_*`).
  api_trigger:
    - services:
        - docker
      docker:
        build: deployment/tokeness-cn/ci/Dockerfile.cnb
      imports: https://cnb.cool/imvhb/tokeness-secrets/-/blob/main/cnb-tokeness-secrets.yml
      env:
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: validate credentials and approved image
          script: |
            set -Eeuo pipefail
            # Diagnostics: which ref/event the applied pipeline actually runs as
            # (the key-repo import is authorized against CNB_BRANCH).
            echo "event=${CNB_EVENT:-} branch=${CNB_BRANCH:-} apply_branch=${APPLY_TRIGGER_BRANCH:-} apply_commit=${APPLY_TRIGGER_COMMIT_SHORT:-}"
            # The applied pipeline inherits the tag through APPLY_TRIGGER_BRANCH;
            # RELEASE_TAG lets a direct API trigger pass it explicitly.
            TAG="${RELEASE_TAG:-${APPLY_TRIGGER_BRANCH:-${CNB_BRANCH:-}}}"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+-tokeness-mainland\.[0-9]+$'; then
              echo "ERROR: api_trigger accepts only v...-tokeness-mainland.<N> tags (got '${TAG:-}')" >&2
              exit 1
            fi
            # Fail closed on missing or malformed credentials before any
            # production call, so a rotated/broken secret stops the release here.
            : "${ALIBABA_CLOUD_ACCESS_KEY_ID:?missing import ALIBABA_CLOUD_ACCESS_KEY_ID (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?missing import ALIBABA_CLOUD_ACCESS_KEY_SECRET (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${CNB_SWAS_SSH_KEY_B64:?missing import CNB_SWAS_SSH_KEY_B64 (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${CNB_SWAS_KNOWN_HOSTS_B64:?missing import CNB_SWAS_KNOWN_HOSTS_B64 (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            key_head="$(printf '%s' "$CNB_SWAS_SSH_KEY_B64" | base64 -d | tr -d '\r' | head -n1)"
            [[ "$key_head" == "-----BEGIN OPENSSH PRIVATE KEY-----" ]] \
              || { echo "ERROR: CNB_SWAS_SSH_KEY_B64 is not an OpenSSH private key" >&2; exit 1; }
            host_count="$(printf '%s' "$CNB_SWAS_KNOWN_HOSTS_B64" | base64 -d | tr -d '\r' | grep -c '^[^#]' || true)"
            [[ "$host_count" -ge 2 ]] \
              || { echo "ERROR: CNB_SWAS_KNOWN_HOSTS_B64 has $host_count host lines, expected >=2" >&2; exit 1; }
            echo "credential import OK (OpenSSH key decodes, $host_count known-host lines)"
            IMAGE_TAG="ml-$TAG"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              | awk '/^Digest:/ { print $2; exit }')
            if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "ERROR: could not resolve an immutable digest for $IMAGE_NAME:$IMAGE_TAG" >&2
              exit 1
            fi
            bash deployment/tokeness-cn/deploy.sh image-ref "$IMAGE_DIGEST"
            echo "Certified release digest: $IMAGE_DIGEST ($TAG)"
            echo "$IMAGE_DIGEST" > /tmp/certified-digest
            echo "$TAG" > /tmp/release-tag
        - name: release to production
          script: |
            set -Eeuo pipefail
            TAG="$(cat /tmp/release-tag)"
            IMAGE_TAG="ml-$TAG"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              | awk '/^Digest:/ { print $2; exit }')
            CERTIFIED=$(cat /tmp/certified-digest 2>/dev/null || true)
            if [ -n "$CERTIFIED" ] && [ "$IMAGE_DIGEST" != "$CERTIFIED" ]; then
              echo "ERROR: digest changed between stages ($CERTIFIED -> $IMAGE_DIGEST)" >&2
              exit 1
            fi
            KEY_FILE=/tmp/cn-ssh/swas-ml
            HOSTS_FILE=/tmp/cn-ssh/known_hosts
            install -d -m 700 /tmp/cn-ssh
            printf '%s' "$CNB_SWAS_SSH_KEY_B64" | base64 -d | tr -d '\r' > "$KEY_FILE"
            printf '%s' "$CNB_SWAS_KNOWN_HOSTS_B64" | base64 -d | tr -d '\r' > "$HOSTS_FILE"
            chmod 600 "$KEY_FILE"
            ALIYUN_BIN=/tmp/cn-bin
            install -d -m 755 "$ALIYUN_BIN"
            if ! command -v aliyun >/dev/null 2>&1; then
              curl -fsSL --connect-timeout 20 --retry 3 \
                -o /tmp/aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest.tgz
              tar -xzf /tmp/aliyun-cli.tgz -C "$ALIYUN_BIN" aliyun
            fi
            export PATH="$ALIYUN_BIN:$PATH"
            aliyun version
            export SWAS_SSH_KEY_PATH="$KEY_FILE"
            export SWAS_SSH_KNOWN_HOSTS="$HOSTS_FILE"
            export SWAS2_SSH_KNOWN_HOSTS="$HOSTS_FILE"
            bash deployment/tokeness-cn/deploy.sh deploy-release "$TAG" "$IMAGE_DIGEST"
        - name: postcheck
          script: |
            set -Eeuo pipefail
            bash deployment/tokeness-cn/deploy.sh postcheck

  tag_deploy.cn-production:
    - services:
        - docker
      # deploy-release + postcheck call python3 (serializer, digest resolution,
      # host version check); the default build env has none.
      docker:
        build: deployment/tokeness-cn/ci/Dockerfile.cnb
      # Deploy credentials come from the imvhb/tokeness-secrets key repo (the
      # CNB-native secret store; CNB has no repo-settings secrets). The file
      # declares allow_slugs/allow_events so ONLY this pipeline can import it;
      # a missing file or scope mismatch fails the import closed.
      imports: https://cnb.cool/imvhb/tokeness-secrets/-/blob/main/cnb-tokeness-secrets.yml
      env:
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: validate approved mainland image
          script: |
            # Production deployments only accept v...-tokeness-mainland.<N> tags.
            TAG="$CNB_BRANCH"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+-tokeness-mainland\.[0-9]+$'; then
              echo "ERROR: cn-production accepts only v...-tokeness-mainland.<N> tags (got '${TAG:-}')" >&2
              exit 1
            fi
            IMAGE_TAG="ml-$TAG"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              | awk '/^Digest:/ { print $2; exit }')
            if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "ERROR: could not resolve an immutable digest for $IMAGE_NAME:$IMAGE_TAG" >&2
              exit 1
            fi
            bash deployment/tokeness-cn/deploy.sh image-ref "$IMAGE_DIGEST"
            echo "Certified release digest: $IMAGE_DIGEST ($TAG)"
            # The deploy stage re-resolves the same digest; keep the certified
            # value visible in the log so both can be compared by a reviewer.
            echo "$IMAGE_DIGEST" > /tmp/certified-digest
        - name: release to production
          script: |
            set -Eeuo pipefail
            TAG="$CNB_BRANCH"
            IMAGE_TAG="ml-$TAG"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              | awk '/^Digest:/ { print $2; exit }')
            CERTIFIED=$(cat /tmp/certified-digest 2>/dev/null || true)
            if [ -n "$CERTIFIED" ] && [ "$IMAGE_DIGEST" != "$CERTIFIED" ]; then
              echo "ERROR: digest changed between stages ($CERTIFIED -> $IMAGE_DIGEST)" >&2
              exit 1
            fi
            # Fail closed on missing secrets: without any one of these the
            # release cannot run gated, so refuse instead of half-deploying.
            : "${ALIBABA_CLOUD_ACCESS_KEY_ID:?missing import ALIBABA_CLOUD_ACCESS_KEY_ID (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?missing import ALIBABA_CLOUD_ACCESS_KEY_SECRET (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${CNB_SWAS_SSH_KEY_B64:?missing import CNB_SWAS_SSH_KEY_B64 (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            : "${CNB_SWAS_KNOWN_HOSTS_B64:?missing import CNB_SWAS_KNOWN_HOSTS_B64 (imvhb/tokeness-secrets/cnb-tokeness-secrets.yml)}"
            # The release gate refuses Windows-style line endings; normalize
            # defensively in case a secret was ever edited on Windows.
            KEY_FILE=/tmp/cn-ssh/swas-ml
            HOSTS_FILE=/tmp/cn-ssh/known_hosts
            install -d -m 700 /tmp/cn-ssh
            printf '%s' "$CNB_SWAS_SSH_KEY_B64" | base64 -d | tr -d '\r' > "$KEY_FILE"
            printf '%s' "$CNB_SWAS_KNOWN_HOSTS_B64" | base64 -d | tr -d '\r' > "$HOSTS_FILE"
            chmod 600 "$KEY_FILE"
            # Pinned aliyun CLI from Alibaba's own CDN; the gated script only
            # uses Describe/Modify ESS/ECI/VPC APIs, stable across 3.x.
            ALIYUN_BIN=/tmp/cn-bin
            install -d -m 755 "$ALIYUN_BIN"
            if ! command -v aliyun >/dev/null 2>&1; then
              curl -fsSL --connect-timeout 20 --retry 3 \
                -o /tmp/aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest.tgz
              tar -xzf /tmp/aliyun-cli.tgz -C "$ALIYUN_BIN" aliyun
            fi
            export PATH="$ALIYUN_BIN:$PATH"
            aliyun version
            export SWAS_SSH_KEY_PATH="$KEY_FILE"
            export SWAS_SSH_KNOWN_HOSTS="$HOSTS_FILE"
            export SWAS2_SSH_KNOWN_HOSTS="$HOSTS_FILE"
            bash deployment/tokeness-cn/deploy.sh deploy-release "$TAG" "$IMAGE_DIGEST"
        - name: postcheck
          script: |
            set -Eeuo pipefail
            bash deployment/tokeness-cn/deploy.sh postcheck
