name: Tokeness Production Deploy

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: read

concurrency:
  group: tokeness-production-deploy
  cancel-in-progress: false

env:
  # The pushing tag is the version identity; the deploy resolves the exact
  # image it published from the same tag. tokeness-production environment
  # approval is the human gate.
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  rollout:
    name: Staged production rollout
    if: github.repository == 'l1i1/new-api' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: tokeness-production
    steps:
      - name: Check out Tokeness mainline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: tokeness/main
          fetch-depth: 1

      - name: Validate deployment request
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^v[0-9A-Za-z._-]+-tokeness-[0-9A-Za-z._-]+$'; then
            echo "::error::Deploy requires a Tokeness immutable tag, for example v1.0.0-rc.36-tokeness-map.1"
            exit 1
          fi
          jq -e . deployment/tokeness/nodes.json >/dev/null
          bash -n deployment/tokeness/remote-command.sh
          bash -n deployment/tokeness/rollout.sh
          for test_script in deployment/tokeness/tests/*-test.sh; do
            bash "$test_script"
          done

      - name: Install restricted deployment identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TOKENESS_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOKENESS_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::tokeness-production deployment secrets are not configured"
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/tokeness-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/tokeness-deploy" "$HOME/.ssh/known_hosts"

      - name: Resolve published image digest for the tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools inspect "ghcr.io/l1i1/new-api:$RELEASE_VERSION" >/dev/null
          IMAGE_DIGEST="$(docker buildx imagetools inspect "ghcr.io/l1i1/new-api:$RELEASE_VERSION" \
            | awk '/^Digest:/ { print $2; exit }')"
          DIGEST="${IMAGE_DIGEST#sha256:}"
          if ! printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::could not resolve an immutable sha256 digest for ${RELEASE_VERSION}"
            exit 1
          fi
          echo "image_digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run staged rollout
        env:
          TOKENESS_SSH_KEY_PATH: ${{ github.workspace }}/.tokeness-deploy-key
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          install -m 0600 "$HOME/.ssh/tokeness-deploy" "$TOKENESS_SSH_KEY_PATH"
          bash deployment/tokeness/rollout.sh deploy "$IMAGE_DIGEST"
