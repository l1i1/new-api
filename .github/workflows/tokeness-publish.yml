name: Tokeness Publish GHCR

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: tokeness-publish
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/l1i1/new-api
  # The pushing tag is the version identity: the tag name is written into
  # VERSION, used as the immutable image tag, and stamped on the image label.
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  test-and-publish:
    name: Test and publish linux/amd64
    if: github.repository == 'l1i1/new-api' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: tokeness-release
    steps:
      - name: Check out Tokeness mainline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: tokeness/main
          fetch-depth: 1

      - name: Validate and set release version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^v[0-9A-Za-z._-]+-tokeness-[0-9A-Za-z._-]+$'; then
            echo "::error::Version must be a Tokeness immutable tag, for example v1.0.0-rc.21-tokeness-affinity.3"
            exit 1
          fi
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          echo "Publishing commit $GITHUB_SHA as $RELEASE_VERSION"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release regression tests
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test ./...
          go vet ./...
          (
            cd relaykit
            GOWORK=off go test ./...
          )
          bash scripts/publish-web-dist-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify frontend distribution credentials
        env:
          WEBDIST_DEPLOY_KEY: ${{ secrets.NEWAPI_WEBDIST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$WEBDIST_DEPLOY_KEY" || {
            echo "::error::NEWAPI_WEBDIST_DEPLOY_KEY is not configured"
            exit 1
          }

      - name: Build frontend distribution for CDN
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/newapi-webdist"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          docker buildx build \
            --target web-dist-export \
            --platform linux/amd64 \
            --file Dockerfile.tokeness \
            --output "type=local,dest=$OUTPUT_DIR" \
            .
          test -f "$OUTPUT_DIR/dist/index.html"
          echo "Frontend distribution built for $RELEASE_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing release tag
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set +e
          INSPECT_OUTPUT=$(docker buildx imagetools inspect \
            "${REGISTRY_IMAGE}:${RELEASE_VERSION}" 2>&1)
          INSPECT_STATUS=$?
          set -e

          if [ "$INSPECT_STATUS" -eq 0 ]; then
            echo "::error::Image tag ${REGISTRY_IMAGE}:${RELEASE_VERSION} already exists"
            exit 1
          fi
          if printf '%s' "$INSPECT_OUTPUT" | grep -Eiq 'manifest unknown|not found'; then
            echo "Release tag is available"
            exit 0
          fi

          echo "::error::Could not establish whether the release tag exists"
          exit "$INSPECT_STATUS"

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.tokeness
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          cache-from: type=gha,scope=tokeness-amd64
          cache-to: type=gha,mode=max,scope=tokeness-amd64
          provenance: mode=max
          sbom: true

      - name: Publish summary
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```text'
            echo "${REGISTRY_IMAGE}:${RELEASE_VERSION}"
            echo "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish frontend distribution to CDN repository
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/newapi-webdist/dist
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          SOURCE_COMMIT: ${{ github.sha }}
          TARGET_BRANCH: web-dist
          WEBDIST_REPO_SLUG: l1i1/newapi-webdist
          WEBDIST_REPO_URL: https://github.com/l1i1/newapi-webdist.git
          WEBDIST_DEPLOY_KEY: ${{ secrets.NEWAPI_WEBDIST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$RUNNER_TEMP/newapi-webdist-ssh"
          printf '%s\n' "$WEBDIST_DEPLOY_KEY" > "$RUNNER_TEMP/newapi-webdist-ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/newapi-webdist-ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/newapi-webdist-ssh/id_ed25519" >/dev/null
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://api.github.com/meta | \
            jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/newapi-webdist-ssh/known_hosts"
          test -s "$RUNNER_TEMP/newapi-webdist-ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/newapi-webdist-ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/newapi-webdist-ssh/known_hosts"
          export WEBDIST_REPO_URL="git@github.com:l1i1/newapi-webdist.git"
          git ls-remote "$WEBDIST_REPO_URL" >/dev/null
          bash scripts/publish-web-dist.sh
          {
            echo
            echo '### Frontend CDN distribution'
            echo
            echo "- Repository: https://github.com/l1i1/newapi-webdist/tree/web-dist/releases/${RELEASE_VERSION}"
            echo "- Manifest: https://raw.githubusercontent.com/l1i1/newapi-webdist/web-dist/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
