# Email notification templates
email.verification.subject: "{{.SystemName}} メールアドレス認証"
email.verification.title: "メールアドレス認証コード"
email.verification.body: "<p>こんにちは。{{.SystemName}} のメールアドレス認証を行っています。あなたの認証コードは：</p><div style='margin:22px 0;padding:18px 24px;background-color:#0b0f14;border:1px solid #24303c;text-align:center;font-size:30px;font-weight:700;letter-spacing:8px;color:#f05260;'>{{.Code}}</div><p>認証コードは {{.Minutes}} 分間有効です。{{.SystemName}} がこのコードを尋ねることは絶対にありません。誰にも共有しないでください。心当たりがない場合は、このメールを無視してください。</p>"
email.password_reset.subject: "{{.SystemName}} パスワード再設定"
email.password_reset.title: "パスワード再設定"
email.password_reset.body: "<p>こんにちは。{{.SystemName}} のパスワード再設定をリクエストしました。続行するには下のボタンをクリックしてください：</p><p style='margin:28px 0;text-align:center;'><a href='{{.Link}}' style='display:inline-block;padding:12px 36px;background-color:#d7192a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;'>パスワードを再設定</a></p><p>ボタンが機能しない場合は、以下のリンクをコピーしてブラウザに貼り付けてください：<br><a href='{{.Link}}' style='color:#f05260;word-break:break-all;'>{{.Link}}</a></p><p>再設定リンクは {{.Minutes}} 分間有効です。心当たりがない場合は、このメールを無視してください。</p>"

