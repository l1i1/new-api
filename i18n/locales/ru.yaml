# Email notification templates
email.verification.subject: "Подтверждение email {{.SystemName}}"
email.verification.title: "Код подтверждения email"
email.verification.body: "<p>Здравствуйте, вы подтверждаете ваш адрес email для {{.SystemName}}. Ваш код подтверждения:</p><div style='margin:22px 0;padding:18px 24px;background-color:#0b0f14;border:1px solid #24303c;text-align:center;font-size:30px;font-weight:700;letter-spacing:8px;color:#f05260;'>{{.Code}}</div><p>Код действителен в течение {{.Minutes}} минут. {{.SystemName}} никогда не попросит вас сообщить этот код — не делитесь им с кем-либо. Если это были не вы, проигнорируйте это письмо.</p>"
email.password_reset.subject: "Сброс пароля {{.SystemName}}"
email.password_reset.title: "Сброс пароля"
email.password_reset.body: "<p>Здравствуйте, вы запросили сброс пароля для {{.SystemName}}. Нажмите кнопку ниже, чтобы продолжить:</p><p style='margin:28px 0;text-align:center;'><a href='{{.Link}}' style='display:inline-block;padding:12px 36px;background-color:#d7192a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;'>Сбросить пароль</a></p><p>Если кнопка не работает, скопируйте и вставьте эту ссылку в браузер:<br><a href='{{.Link}}' style='color:#f05260;word-break:break-all;'>{{.Link}}</a></p><p>Ссылка для сброса действительна в течение {{.Minutes}} минут. Если это были не вы, проигнорируйте это письмо.</p>"

